[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resqbot"
version = "7.0.0"
description = "Modular multi-agent disaster rescue robotics simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5.0"]

[tool.setuptools.packages.find]
include = ["resqbot*"]
